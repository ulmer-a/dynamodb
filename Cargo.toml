[package]
name = "pro_dynamo"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = [ "Alexander Ulmer <ulmer@balu.care>" ]
description = "High level DynamoDB abstraction"
repository = "https://github.com/ulmer-a/dynamodb"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = [ "dynamodb", "aws", "database", "nosql" ]
categories = [ "database", "api-bindings" ]

[features]
default = [ "mock", "aws" ]
mock = []
aws = [ "dep:aws-sdk-dynamodb", "dep:aws-config", "dep:serde_dynamo" ]
# Runs the conformance suite against a DynamoDB Local instance in addition to the mock. Needs a
# server on http://localhost:8000 (override with DYNAMODB_LOCAL_ENDPOINT); see
# src/conformance/local.rs.
dynamodb-local-tests = [ "aws" ]

[dependencies]
async-trait = "0.1.86"
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
aws-config = { version = "1.8.8", optional = true }
aws-sdk-dynamodb = { version = "1.96.0", optional = true }
serde_dynamo = { version = "4.3.0", features = [ "aws-sdk-dynamodb+1" ], optional = true }

[dev-dependencies]
tokio = { version = "1.49.0", features = [ "macros", "rt" ] }
